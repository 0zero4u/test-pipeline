# Research RAG Configuration

ingestion:
  parser: docling
  chunk_size_min: 500
  chunk_size_max: 900
  chunk_overlap: 0.12

extraction:
  entity_model: deepseek/deepseek-v4-flash
  embedding_model: bge-base-en-v1.5

retrieval:
  top_k: 5
  similarity_threshold: 0.7

synthesis:
  model: deepseek/deepseek-v4-flash
  max_tokens: 2000
  temperature: 0.3

storage:
  chroma_path: ./data/chroma
  metadata_path: ./data/metadata

log_level: INFO
debug: false
